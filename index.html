<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BurgerKIR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
    <h2>BurgerKIR</h2>
    </header>  

    <section id="home" class="hero">

        <div>
            <p>Selamat Datang di</p>

            <h1>BurgerKIR</h1>

            <p>
                Burger enak dengan harga terjangkau.
            </p>

            <a href="#menu" class="button">
                Lihat Menu
            </a>
        </div>

        <div class="burger">
            🍔
        </div>

    </section>

    <section id="menu">

        <h2>Menu Burger</h2>

        <div id="menuBurger" class="menu-container"></div>

    </section>

    <section id="pesan">

        <h2>Pesanan Saya</h2>

        <p id="pesanan">
            Belum ada pesanan.
        </p>

        <h3 id="total">
            Total: Rp0
        </h3>

        <button id="pesanButton" class="button">
            Pesan Sekarang
        </button>

        <p id="pesanText"></p>

    </section>


    <section id="info">

        <h2>Info Burger</h2>

        <p id="infoText">
            Memuat informasi...
        </p>

    </section>


    <footer>
        <p> 2026 BurgerKIR</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
